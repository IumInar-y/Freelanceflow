<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreelanceFlow AI</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --paper: #faf7f2;
        --card: #ffffff;
        --ink: #211d18;
        --muted: #7a7266;
        --line: #e9e2d6;
        --accent: #e8590c;
        --accent-soft: #ffe8d6;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 380px;
        background: var(--paper);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 240px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
